<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self' qrc:;style-src 'self' 'unsafe-inline';img-src 'self' data:;font-src 'self'"><title>映印 · 奖状工作台</title><link rel="stylesheet" href="work.css"></head>
<body><div id="space" aria-hidden="true"></div><header><div class="brand"><img class="brand-icon" src="mark.png" width="37" height="37" alt=""><strong>映印</strong><i></i><span>奖状工作台</span></div><nav><button id="motion" aria-pressed="true">空间动效 · 开</button><button id="settings">导出设置</button><div class="window-tools" role="group" aria-label="窗口控制"><button id="minimize" aria-label="最小化" title="最小化">─</button><button id="fullscreen" aria-label="全屏" title="全屏">⛶</button><button id="closeWindow" aria-label="关闭窗口" title="关闭窗口">×</button></div></nav></header>
<main><section class="intro"><h1>分组奖状制作</h1><p id="summary">正在读取本机工作簿…</p></section>
<div class="workspace"><section class="glass roster"><div class="sectionTitle"><h2>分组名单</h2><button id="add">＋ 新增分组</button></div><div class="toolbar"><button class="accent" id="import">导入名单</button><button id="awards">导入获奖表</button><input type="search" id="search" aria-label="搜索组号、作品或姓名" placeholder="搜索组号、作品或姓名"></div>
<div class="tablewrap"><table><thead><tr><th>组别</th><th>作品名称</th><th>人数</th><th>奖项</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" hidden></p></div>
<div class="detail"><div class="sectionTitle"><h3 id="groupLabel">组员</h3><button id="edit">编辑分组</button></div><div id="members"></div></div></section>
<section class="glass preview"><div class="sectionTitle"><h2>奖状预览</h2><button id="design">编辑文本与布局</button></div>
<div id="proofStatus" class="hint" role="status">等待 Photoshop 预览</div><div class="stage"><div class="paper" id="paper"><strong>荣 誉 证 书</strong><div class="recipient" id="recipient"></div><div class="film" id="film"></div><b id="awardText">请选择分组</b><small id="credits"></small><span id="stamp"></span></div></div>
<label class="field">预览奖项<select id="award"></select></label>
<div class="duo"><label class="field">落款日期<input id="date" placeholder="2026年11月"></label><div class="field">模板背景<button id="bg">导入背景图片</button></div></div>
<div id="bginfo" hidden><span id="bgname"></span><button class="link" id="reset">恢复原背景</button></div>
<button class="primary" id="export">导出 PSD 与分组 PDF <span>↗</span></button>
</section></div><footer role="status" aria-live="polite"><span id="status">就绪</span><button id="folder" hidden>打开输出文件夹</button><span class="copyright">© 2026 XunYi-XX</span></footer></main>
<dialog id="editor"><form id="form"><div class="sectionTitle"><h2 id="edtitle">编辑分组</h2><button type="button" class="close" aria-label="关闭">×</button></div><div class="duo"><label class="field">组号<input id="num" type="number" min="1" max="999" required></label><label class="field">作品名称<input id="title" required></label></div><label class="field">组员姓名<textarea id="names" rows="3" required placeholder="用顿号分隔"></textarea></label><label class="field">所获奖项<textarea id="prizes" rows="2" placeholder="用顿号分隔，留空则跳过该组"></textarea></label><p class="error" id="validation" role="alert"></p><button class="primary">保存分组</button></form></dialog>
<dialog id="designer"><div class="sectionTitle"><h2>证书文本与布局</h2><button class="close" aria-label="关闭布局编辑器">×</button></div>
<div class="design-grid"><div><div class="design-sheet" id="sheet" aria-label="证书布局画布"></div><p class="hint">拖动文本定位，或在右侧输入精确坐标。位置以画布百分比计。</p><div class="design-actions"><button id="saveLayout">保存方案…</button><button id="loadLayout">载入方案…</button><button id="factory">恢复默认布局</button></div></div>
<div class="inspector"><label class="field">文本块<select id="block"></select></label><button id="newBlock">＋ 添加文本</button><label class="field">内容<textarea id="copy" rows="4"></textarea></label><select id="token" aria-label="插入变量"><option value="">插入动态字段…</option></select><div class="duo"><label class="field">水平位置 %<input id="posX" type="number" min="0" max="100" step=".1"></label><label class="field">垂直位置 %<input id="posY" type="number" min="0" max="100" step=".1"></label></div>
<div class="duo"><label class="field">字号 pt<input id="pointSize" type="number" min="1" max="150" step=".1"></label><label class="field">最大宽度 %<input id="textWidth" type="number" min="1" max="100" step=".1"></label></div>
<label class="field">对齐<select id="alignment"><option value="left">左对齐</option><option value="center">居中</option><option value="right">右对齐</option></select></label><label><input type="checkbox" id="visible"> 显示此文本块</label><button id="doneLayout" class="primary">完成编辑</button></div></div><div id="designStatus" role="status"></div></dialog><dialog id="prefs"><div class="sectionTitle"><h2>导出设置</h2><button class="close" aria-label="关闭">×</button></div><label class="field">Photoshop 程序<button id="ps">选择 Photoshop.exe</button></label><label class="field">PSD 模板<button id="template">内置奖状模板</button></label></dialog>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script><script src="three.min.js"></script><script src="layout.js"></script><script src="space.js"></script><script src="work.js"></script></body></html>
